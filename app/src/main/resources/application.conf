server {
    host = "0.0.0.0"
    port = 8080
    port = ${?SERVER_PORT}
}

vk {
    token = "changeme"
    token = ${?VK_TOKEN}
    # peer_id of the common Pangea chat (2000000000 + chat_id): auction announcements go there.
    chat-peer-id = 2000000001
    chat-peer-id = ${?VK_CHAT_PEER_ID}
}

# Касса Т-Банка: продажа дублонов за рубли.
#
# Пока terminal-key и password пусты, донат выключен целиком — у Рахадима
# остаётся заглушка «пока не работает». Так же он выключится, если прайс-лист
# не пройдёт проверку на старте (см. DonationSku.validate).
tbank {
    terminal-key = ""
    terminal-key = ${?TBANK_TERMINAL_KEY}
    password = ""
    password = ${?TBANK_PASSWORD}

    api-url = "https://securepay.tinkoff.ru/v2"
    api-url = ${?TBANK_API_URL}

    # Куда банк постит статусы платежей: POST /pay/tbank/notify этого приложения.
    # Нужен HTTPS и домен — ходит сюда сервер банка.
    notification-url = ""
    notification-url = ${?TBANK_NOTIFICATION_URL}

    # Куда банк возвращает БРАУЗЕР игрока после оплаты. Ведём в сообщество:
    # игрок попадает туда, где игра и продолжается, а бот через секунду пишет
    # ему о зачислении.
    # Можно точнее — сразу в диалог, но для этого нужен числовой id
    # сообщества: https://vk.ru/im?sel=-123456789
    success-url = "https://vk.ru/stigmapangeaproject"
    success-url = ${?TBANK_SUCCESS_URL}
    fail-url = "https://vk.ru/stigmapangeaproject"
    fail-url = ${?TBANK_FAIL_URL}

    # Налоговые поля кассового чека. Значения по умолчанию — для УСН «доходы»;
    # подтвердить с бухгалтерией, они уходят в фискальный документ.
    # taxation: osn | usn_income | usn_income_outcome | patent | envd | esn
    # tax: none | vat0 | vat5 | vat7 | vat10 | vat22 | vat105 | vat107 | vat110 | vat122
    # payment-object: признак предмета расчёта, тег ФФД 1212
    taxation = "usn_income"
    taxation = ${?TBANK_TAXATION}
    tax = "none"
    tax = ${?TBANK_TAX}
    payment-object = "service"
    payment-object = ${?TBANK_PAYMENT_OBJECT}

    # Ссылка на оферту — показывается на экране подтверждения покупки.
    offer-url = ""
    offer-url = ${?TBANK_OFFER_URL}

    # Срок жизни ссылки на оплату.
    link-minutes = 60
    link-minutes = ${?TBANK_LINK_MINUTES}

    # Сколько копеек игрок может оплатить за сутки. 0 — без ограничения.
    daily-limit = 1000000
    daily-limit = ${?TBANK_DAILY_LIMIT}

    # Прайс-лист. ЗАГЛУШКА — подставить настоящие цены и объёмы.
    # price — в КОПЕЙКАХ (как того требует Amount у банка).
    # receipt — наименование позиции в чеке: не длиннее 128 символов и без ' " & < >
    # id — ключ пакета; у уже продававшегося пакета его менять нельзя.
    packs = [
        { id = "d100",  doubloons = 100,  price = 9900,   label = "100 дублонов",  receipt = "100 дублонов (игровая валюта)" },
        { id = "d550",  doubloons = 550,  price = 49900,  label = "550 дублонов",  receipt = "550 дублонов (игровая валюта)" },
        { id = "d1200", doubloons = 1200, price = 99900,  label = "1200 дублонов", receipt = "1200 дублонов (игровая валюта)" },
        { id = "d2500", doubloons = 2500, price = 199900, label = "2500 дублонов", receipt = "2500 дублонов (игровая валюта)" }
    ]
}

postgres {
    jdbc-url = "jdbc:postgresql://localhost:5432/pangea"
    jdbc-url = ${?POSTGRES_JDBC_URL}
    username = "pangea"
    username = ${?POSTGRES_USER}
    password = "pangea"
    password = ${?POSTGRES_PASSWORD}
}