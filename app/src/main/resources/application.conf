server {
    host = "0.0.0.0"
    port = 8080
    port = ${?SERVER_PORT}
}

vk {
    token = "changeme"
    token = ${?VK_TOKEN}
    # peer_id of the common Pangea chat (2000000000 + chat_id): auction announcements go there.
    chat-peer-id = 2000000001
    chat-peer-id = ${?VK_CHAT_PEER_ID}
}

# Касса Т-Банка: продажа дублонов за рубли.
#
# Пока terminal-key и password пусты, донат выключен целиком — у Рахадима
# остаётся заглушка «пока не работает». Так же он выключится, если прайс-лист
# не пройдёт проверку на старте (см. DonationSku.validate).
robokassa {
    merchant-login = ""
    merchant-login = ${?ROBOKASSA_MERCHANT_LOGIN}
    # Пароль #1 подписывает ссылку на оплату, пароль #2 — проверяет ResultURL и
    # запросы состояния. В тестовом режиме здесь ТЕСТОВЫЕ пароли из кабинета.
    password-1 = ""
    password-1 = ${?ROBOKASSA_PASSWORD1}
    password-2 = ""
    password-2 = ${?ROBOKASSA_PASSWORD2}

    # Тестовый режим (IsTest=1): платежи понарошку, OpStateExt их не видит.
    test = false
    test = ${?ROBOKASSA_TEST}

    # Алгоритм подписи — ровно тот, что выбран в технических настройках
    # магазина: md5 | sha1 | sha256 | sha384 | sha512. Опечатка роняет запуск.
    hash = "sha256"
    hash = ${?ROBOKASSA_HASH}

    pay-url = "https://auth.robokassa.ru/Merchant/Index.aspx"
    op-state-url = "https://auth.robokassa.ru/Merchant/WebService/Service.asmx/OpStateExt"

    # ResultURL, SuccessURL и FailURL задаются в кабинете Робокассы, не здесь:
    #   ResultURL  → https://<домен>/pay/robokassa/result, метод POST
    #   SuccessURL / FailURL → https://vk.ru/stigmapangeaproject

    # Передавать ли состав чека (Receipt). Чек самозанятого в «Мой налог»
    # выбивают Робочеки СМЗ; нужен ли им наш Receipt — уточнить у Робокассы.
    # Без него наименование покупки уходит только в Description.
    send-receipt = false
    send-receipt = ${?ROBOKASSA_SEND_RECEIPT}
    # Поля позиции чека — только при send-receipt = true.
    # tax: none | vat0 | vat5 | vat7 | vat10 | vat20 | vat22 | vat105 | vat107 | vat110 | vat120 | vat122
    tax = "none"
    tax = ${?ROBOKASSA_TAX}
    payment-object = "service"
    payment-object = ${?ROBOKASSA_PAYMENT_OBJECT}

    # Ссылка на оферту — показывается на экране подтверждения покупки.
    offer-url = ""
    offer-url = ${?ROBOKASSA_OFFER_URL}

    # Срок жизни ссылки на оплату.
    link-minutes = 60
    link-minutes = ${?ROBOKASSA_LINK_MINUTES}

    # Сколько копеек игрок может оплатить за сутки. 0 — без ограничения.
    daily-limit = 1000000
    daily-limit = ${?ROBOKASSA_DAILY_LIMIT}

    # Прайс-лист. ЗАГЛУШКА — подставить настоящие цены и объёмы.
    # price — в РУБЛЯХ: 99 или 99.50. Точнее копейки нельзя — бот не запустится.
    # receipt — наименование покупки (Description и позиция чека): не длиннее
    # 100 символов и без ' " & < >
    # id — ключ пакета; у уже продававшегося пакета его менять нельзя.
    packs = [
        { id = "d100",  doubloons = 100,  price = 99,    label = "100 дублонов",  receipt = "100 дублонов (игровая валюта)" },
        { id = "d550",  doubloons = 550,  price = 499,   label = "550 дублонов",  receipt = "550 дублонов (игровая валюта)" },
        { id = "d1200", doubloons = 1200, price = 999,   label = "1200 дублонов", receipt = "1200 дублонов (игровая валюта)" },
        { id = "d2500", doubloons = 2500, price = 1999,  label = "2500 дублонов", receipt = "2500 дублонов (игровая валюта)" }
    ]
}

postgres {
    jdbc-url = "jdbc:postgresql://localhost:5432/pangea"
    jdbc-url = ${?POSTGRES_JDBC_URL}
    username = "pangea"
    username = ${?POSTGRES_USER}
    password = "pangea"
    password = ${?POSTGRES_PASSWORD}
}