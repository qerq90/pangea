services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    ports:
      - "80:8080"
    environment:
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      VK_TOKEN: ${VK_TOKEN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TBANK_TERMINAL_KEY: ${TBANK_TERMINAL_KEY:-}
      TBANK_PASSWORD: ${TBANK_PASSWORD:-}
      TBANK_NOTIFICATION_URL: ${TBANK_NOTIFICATION_URL:-}
      TBANK_SUCCESS_URL: ${TBANK_SUCCESS_URL:-}
      TBANK_FAIL_URL: ${TBANK_FAIL_URL:-}
      TBANK_OFFER_URL: ${TBANK_OFFER_URL:-}
      TBANK_TAXATION: ${TBANK_TAXATION:-usn_income}
      TBANK_TAX: ${TBANK_TAX:-none}
      TBANK_PAYMENT_OBJECT: ${TBANK_PAYMENT_OBJECT:-service}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
