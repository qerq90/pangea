  text: "Трактирщик протирает кружку видавшей виды тряпкой и выжидающе смотрит на вас."
  turnInLabel: "Сдать квестовые предметы"
  backLabel:
    label: "Вернуться"
    color: "negative"
  noActive: "У вас нет активного задания."
  noItem: "В вашем инвентаре нет подходящего трофея (нужен трофей расы «{race}»)."
